name: orthopro

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: orthopro-postgres
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      POSTGRES_DB: ${DATABASE_NAME:-orthopro}
      POSTGRES_USER: ${DATABASE_USER:-orthopro}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - orthopro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: orthopro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - orthopro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orthopro_postgres_data:
  orthopro_redis_data:
